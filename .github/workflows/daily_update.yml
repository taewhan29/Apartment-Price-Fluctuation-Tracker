name: Daily Apartment Data Collector

on:
  schedule:
    # 매일 UTC 22:00 (한국 시간 KST 기준 오전 07:00)
    - cron: '0 22 * * *'
  workflow_dispatch: # GitHub 웹 인터페이스에서 수동 실행 버튼 제공

jobs:
  collect-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 깃 커밋 및 푸시 권한 부여

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data collection script
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          python collector.py

      - name: Commit and Push updated data files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: 매일 07:00 KST 아파트 실거래가 자동 수집 갱신 [skip ci]"
          file_pattern: "data/*.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
